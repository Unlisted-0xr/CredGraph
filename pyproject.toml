[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credgraph"
version = "1.0.0"
description = "Credential exposure investigation and correlation engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CredGraph Contributors"}]
dependencies = []

[project.scripts]
credgraph = "credgraph.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
